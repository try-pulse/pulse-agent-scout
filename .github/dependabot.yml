version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Build against the oldest supported Node major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      pulse-sdk:
        patterns: ["@try-pulse/*"]
      dependencies:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
